name: Build Wentgram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36 and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Show Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          java -version

      - name: Configure Telegram API
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          sed -i "s/public static int APP_ID = [0-9]*;/public static int APP_ID = ${TELEGRAM_API_ID};/" "$FILE"
          sed -i 's#public static String APP_HASH = ".*";#public static String APP_HASH = "'${TELEGRAM_API_HASH}'";#' "$FILE"
          grep "APP_ID" "$FILE"
          echo "APP_HASH configured"
      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Wentgram APK
        run: ./gradlew :TMessagesProj_App:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wentgram-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
