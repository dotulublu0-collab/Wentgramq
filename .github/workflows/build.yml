name: Build Wentgram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36 and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Show Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          java -version

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Wentgram APK
        run: ./gradlew :TMessagesProj_App:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wentgram-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
